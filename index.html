<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Control — Squad Battle Royale</title>
<!-- React & ReactDOM -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- Babel for in-browser JSX compilation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<!-- CSS -->
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin:0; padding:0; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Plain JS Utils -->
<script src="utils.js"></script>

<!-- React Components & App (Inlined to bypass CORS) -->
<script type="text/babel" data-presets="react">
var { useState, useEffect, useRef, useCallback, useMemo } = React;

// ==========================================
// SHARED COMPONENTS
// ==========================================
function SearchableDropdown({ options, value, onChange, placeholder, disabled }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const containerRef = useRef(null);
  
  const selectedOption = options.find(o => o.id === value);
  
  useEffect(() => {
    if (!open) {
      if (selectedOption) setQuery(selectedOption.name);
      else setQuery("");
    }
  }, [value, selectedOption, open]);

  useEffect(() => {
    function handleClickOutside(event) {
      if (containerRef.current && !containerRef.current.contains(event.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  const filtered = options.filter(o => o.name.toLowerCase().includes(query.toLowerCase()));

  return (
    <div className="search-dropdown" ref={containerRef}>
      <input 
        type="text" 
        value={query} 
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => { setQuery(""); setOpen(true); }}
        placeholder={placeholder}
        disabled={disabled}
      />
      {open && !disabled && (
        <div className="search-dropdown-list">
          {filtered.map(o => (
            <div key={o.id} className="search-dropdown-item" onClick={() => { onChange(o.id); setOpen(false); }}>
              {o.name}
            </div>
          ))}
          {filtered.length === 0 && <div className="search-dropdown-item hint">No matches found</div>}
        </div>
      )}
    </div>
  );
}

function StandingsTable({ rows, highlightTop, medalTop3 }) {
  return (
    <table className="standings">
      <thead>
        <tr>
          <th>#</th>
          <th>Team Name</th>
          <th>Played</th>
          <th>Kills</th>
          <th>Total Points</th>
        </tr>
      </thead>
      <tbody>
        {rows.map((r, i) => (
          <tr key={r.id} className={medalTop3 && i < 3 ? `medal medal-${i + 1}` : highlightTop && i < highlightTop ? "adv" : ""}>
            <td>{i + 1}</td>
            <td>{r.name}</td>
            <td>{r.played}</td>
            <td>{r.kills}</td>
            <td className="pts">{r.points}</td>
          </tr>
        ))}
        {rows.length === 0 && (
          <tr>
            <td colSpan="5" style={{textAlign:"center", color:"var(--muted)", padding:"30px"}}>No teams available.</td>
          </tr>
        )}
      </tbody>
    </table>
  );
}

// ==========================================
// MATCH FORM
// ==========================================
function MatchForm({ allTeams, availableTeamIds, onSubmit, onCancel, label, defaultMap }) {
  const NUM_ROWS = 12;
  const [results, setResults] = useState(Array.from({length: NUM_ROWS}, () => ({ teamId: "", placement: "", kills: "" })));
  const [map, setMap] = useState(defaultMap || MAPS[0]);
  
  const availableOptions = allTeams.filter(t => availableTeamIds.includes(t.id));
  const update = (idx, field, value) => setResults(rs => rs.map((r, i) => i === idx ? { ...r, [field]: value } : r));
  const validResults = results.filter(r => r.teamId && r.placement !== "" && Number(r.placement) >= 1);

  return (
    <div className="matchform">
      <div className="matchform-head">Log {label}</div>
      <div style={{display:"flex", gap:"16px", marginBottom: "16px", alignItems:"center"}}>
        <label className="hint" style={{display:"flex", alignItems:"center", gap:"8px"}}>
          Map:
          <select className="dropdown-simple" style={{width: "auto"}} value={map} onChange={(e) => setMap(e.target.value)}>
            {MAPS.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </label>
      </div>
      
      <div className="matchform-grid">
        <div className="matchform-row matchform-row--header">
          <span>Team</span>
          <span>Placement</span>
          <span>Kills</span>
        </div>
        {results.map((r, idx) => (
          <div className="matchform-row" key={idx}>
            <SearchableDropdown options={availableOptions} value={r.teamId} onChange={(val) => update(idx, "teamId", val)} placeholder="Select Team" />
            <input type="number" min="1" max="12" value={r.placement} onChange={(e) => update(idx, "placement", e.target.value)} placeholder="#" />
            <input type="number" min="0" value={r.kills} onChange={(e) => update(idx, "kills", e.target.value)} placeholder="0" />
          </div>
        ))}
      </div>
      <div className="matchform-actions">
        <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
        <button className="btn btn-accent" disabled={validResults.length === 0} onClick={() => onSubmit(validResults.map(r => ({ ...r, placement: Number(r.placement), kills: Number(r.kills) })), map)}>Save Match</button>
      </div>
    </div>
  );
}

// ==========================================
// REGISTRATION TAB
// ==========================================
function RegistrationTab({ allTeams, activeTournaments, onRegisterTeam, onRequestTournament }) {
  const [subTab, setSubTab] = useState("team");

  return (
    <section className="panel" style={{maxWidth: "800px"}}>
      <div className="sub-tabs">
        <button className={`subtabbtn ${subTab === "team" ? "active" : ""}`} onClick={() => setSubTab("team")}>1. Register Permanent Team</button>
        <button className={`subtabbtn ${subTab === "tournament" ? "active" : ""}`} onClick={() => setSubTab("tournament")}>2. Request Tournament Entry</button>
      </div>
      
      {subTab === "team" && <TeamRegistrationForm onRegister={onRegisterTeam} />}
      {subTab === "tournament" && <TournamentRegistrationForm allTeams={allTeams} activeTournaments={activeTournaments} onSubmit={onRequestTournament} />}
    </section>
  );
}

function TeamRegistrationForm({ onRegister }) {
  const [form, setForm] = useState({ name: "", captain: "", phone: "", p1: "", p2: "", p3: "", p4: "" });
  
  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.captain.trim() || !form.p1.trim() || !form.p2.trim() || !form.p3.trim() || !form.p4.trim()) return alert("Please fill all required fields.");
    onRegister(form);
    setForm({ name: "", captain: "", phone: "", p1: "", p2: "", p3: "", p4: "" });
    alert("Team successfully registered into the global database!");
  };

  return (
    <form className="matchform" onSubmit={handleSubmit} style={{border: "none", padding: 0, background: "transparent"}}>
      <div className="matchform-head">Global Team Registration</div>
      <p className="hint" style={{marginBottom: "16px"}}>Register your team once. You can then use it to enter any future tournaments.</p>
      
      <div className="matchform-grid" style={{ gridTemplateColumns: "1fr 1fr", gap: "16px" }}>
        <div><label className="hint">Team Name *</label><input required value={form.name} onChange={e=>setForm({...form, name: e.target.value})} placeholder="E.g. Galaxy Racers" /></div>
        <div><label className="hint">Captain Name *</label><input required value={form.captain} onChange={e=>setForm({...form, captain: e.target.value})} placeholder="In-game Name" /></div>
        <div><label className="hint">Captain Contact Number *</label><input required value={form.phone} onChange={e=>setForm({...form, phone: e.target.value})} placeholder="+91..." /></div>
        <div style={{gridColumn: "1 / -1"}}><hr style={{border:"none", borderTop:"1px solid var(--border)"}}/></div>
        <div><label className="hint">Player 1 *</label><input required value={form.p1} onChange={e=>setForm({...form, p1: e.target.value})} /></div>
        <div><label className="hint">Player 2 *</label><input required value={form.p2} onChange={e=>setForm({...form, p2: e.target.value})} /></div>
        <div><label className="hint">Player 3 *</label><input required value={form.p3} onChange={e=>setForm({...form, p3: e.target.value})} /></div>
        <div><label className="hint">Player 4 *</label><input required value={form.p4} onChange={e=>setForm({...form, p4: e.target.value})} /></div>
      </div>
      <div className="matchform-actions">
        <button type="submit" className="btn btn-accent">Register Team</button>
      </div>
    </form>
  );
}

function TournamentRegistrationForm({ allTeams, activeTournaments, onSubmit }) {
  const [form, setForm] = useState({ tournamentId: "", teamId: "", payerName: "" });

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.tournamentId || !form.teamId || !form.payerName.trim()) return alert("Please fill all fields.");
    onSubmit(form);
    setForm({ tournamentId: "", teamId: "", payerName: "" });
    alert("Registration requested! Waiting for admin payment verification.");
  };

  return (
    <form className="matchform" onSubmit={handleSubmit} style={{border: "none", padding: 0, background: "transparent"}}>
      <div className="matchform-head">Tournament Registration Request</div>
      <p className="hint" style={{marginBottom: "16px"}}>Select a tournament and your globally registered team. Verification is required.</p>
      
      <div className="matchform-grid" style={{ gridTemplateColumns: "1fr", gap: "16px" }}>
        <div>
          <label className="hint">Select Active Tournament *</label>
          <select className="dropdown-simple" required value={form.tournamentId} onChange={e=>setForm({...form, tournamentId: e.target.value})}>
            <option value="">-- Choose Tournament --</option>
            {activeTournaments.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
        <div>
          <label className="hint">Select Registered Team *</label>
          <SearchableDropdown options={allTeams} value={form.teamId} onChange={id => setForm({...form, teamId: id})} placeholder="Search for your team..." />
        </div>
        <div>
          <label className="hint">Payer's Name (For Verification) *</label>
          <input required value={form.payerName} onChange={e=>setForm({...form, payerName: e.target.value})} placeholder="Name on the payment account" />
        </div>
        
        <div style={{textAlign: "center", marginTop: "16px"}}>
          <p className="hint" style={{marginBottom: "8px"}}>Scan to Pay</p>
          <img src="qr.jpeg" alt="Payment QR Code" style={{maxWidth: "100%", height: "auto", display: "block", margin: "0 auto", borderRadius: "8px"}} width="413" height="436" />
        </div>
      </div>
      <div className="matchform-actions">
        <button type="submit" className="btn btn-accent">Request Tournament Registration</button>
      </div>
    </form>
  );
}


// ==========================================
// APP COMPONENT
// ==========================================
function App() {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  
  // UI State
  const [tab, setTab] = useState("global"); 
  const [isEditMode, setIsEditMode] = useState(false);
  const [selectedTournamentId, setSelectedTournamentId] = useState("");
  const [formOpen, setFormOpen] = useState(null); // 'A' | 'B' | 'final' | null
  
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : defaultState();
      // Migration safety
      if (!parsed.tournaments) parsed.tournaments = [];
      if (!parsed.pendingRegistrations) parsed.pendingRegistrations = [];
      setState(parsed);
      if (parsed.tournaments.length > 0) setSelectedTournamentId(parsed.tournaments[0].id);
    } catch {
      setState(defaultState());
    }
    setLoaded(true);
  }, []);

  const persist = useCallback((next) => {
    setState(next);
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch {}
  }, []);

  if (!loaded || !state) return <div className="ff-loading"><div className="pulse">LOADING SYSTEM...</div></div>;

  const t = state.tournaments.find(x => x.id === selectedTournamentId); // Currently selected tournament

  // -------------------------
  // Handlers
  // -------------------------
  const handleToggleEdit = (mode) => {
    if (mode === "edit") {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === ADMIN_PASSWORD) setIsEditMode(true);
      else alert("Incorrect password. Returning to View mode.");
    } else {
      setIsEditMode(false);
    }
  };

  const handleRegisterTeam = (form) => {
    persist({ ...state, teams: [...state.teams, { id: `t${Date.now()}`, ...form }] });
  };

  const handleRequestTournament = (form) => {
    const req = { id: `req${Date.now()}`, ...form, status: "pending", submittedAt: new Date().toLocaleString() };
    persist({ ...state, pendingRegistrations: [...state.pendingRegistrations, req] });
  };

  const handleCreateTournament = () => {
    const name = prompt("Enter new Tournament Name:");
    if (!name) return;
    const newT = { id: `tourney_${Date.now()}`, name, status: "active", participants: [], groupA: [], groupB: [], groupMatches: [], finalMatches: [] };
    const next = { ...state, tournaments: [...state.tournaments, newT] };
    persist(next);
    setSelectedTournamentId(newT.id);
  };
  
  const handleRemoveTournament = (id) => {
    if (!confirm("Are you sure you want to completely delete this tournament? This cannot be undone.")) return;
    const next = { ...state, tournaments: state.tournaments.filter(x => x.id !== id) };
    persist(next);
    if (selectedTournamentId === id) setSelectedTournamentId(next.tournaments.length > 0 ? next.tournaments[0].id : "");
  };

  const handleApproveReq = (reqId) => {
    if(!confirm("Has payment been verified for this registration?")) return;
    let next = {...state};
    const req = next.pendingRegistrations.find(r => r.id === reqId);
    if(req) {
      req.status = "approved";
      const tourney = next.tournaments.find(tx => tx.id === req.tournamentId);
      if(tourney && !tourney.participants.includes(req.teamId)) {
          tourney.participants.push(req.teamId);
      }
    }
    persist(next);
  };

  const handleRejectReq = (reqId) => {
    let next = {...state};
    const req = next.pendingRegistrations.find(r => r.id === reqId);
    if(req) req.status = "rejected";
    persist(next);
  };

  const toggleGroup = (teamId, group) => {
    if (!t || !isEditMode) return;
    let next = { ...state };
    const tRef = next.tournaments.find(x => x.id === t.id);
    if (group === "A") tRef.groupA = tRef.groupA.includes(teamId) ? tRef.groupA.filter(id => id !== teamId) : [...tRef.groupA, teamId];
    else tRef.groupB = tRef.groupB.includes(teamId) ? tRef.groupB.filter(id => id !== teamId) : [...tRef.groupB, teamId];
    persist(next);
  };

  const addMatch = (group, results, map) => {
    if (!t) return;
    let next = { ...state };
    const tRef = next.tournaments.find(x => x.id === t.id);
    const num = tRef.groupMatches.filter(m => m.group === group).length + 1;
    tRef.groupMatches.push({ id: `${group}m${Date.now()}`, group, label: `Match ${num}`, map, results });
    persist(next);
    setFormOpen(null);
  };

  const addFinalMatch = (results, map) => {
    if (!t) return;
    let next = { ...state };
    const tRef = next.tournaments.find(x => x.id === t.id);
    const num = tRef.finalMatches.length + 1;
    tRef.finalMatches.push({ id: `fm${Date.now()}`, label: `Final ${num}`, map, results });
    persist(next);
    setFormOpen(null);
  };

  const removeGroupMatch = (id) => {
    if(!t) return;
    let next = { ...state };
    const tRef = next.tournaments.find(x => x.id === t.id);
    tRef.groupMatches = tRef.groupMatches.filter(m => m.id !== id);
    persist(next);
  };
  
  const removeFinalMatch = (id) => {
    if(!t) return;
    let next = { ...state };
    const tRef = next.tournaments.find(x => x.id === t.id);
    tRef.finalMatches = tRef.finalMatches.filter(m => m.id !== id);
    persist(next);
  };

  // -------------------------
  // Computed State
  // -------------------------
  const globalMatches = state.tournaments.flatMap(x => [...x.groupMatches, ...x.finalMatches]);
  const globalStandings = computeStandings(state.teams.map(team => team.id), state.teams, globalMatches);
  
  const groupAStandings = t ? computeStandings(t.groupA, state.teams, t.groupMatches.filter(m => m.group === "A")) : [];
  const groupBStandings = t ? computeStandings(t.groupB, state.teams, t.groupMatches.filter(m => m.group === "B")) : [];
  
  const finalsTeamIds = t ? [...new Set(t.finalMatches.flatMap(m => m.results.map(r => r.teamId)))] : [];
  const finalStandings = t ? computeStandings(finalsTeamIds, state.teams, t.finalMatches) : [];

  return (
    <div className="ff-root">
      <header className="ff-header">
        <div className="ff-titleblock">
          <span className="eyebrow">SQUAD BATTLE ROYALE</span>
          <h1>TOURNAMENT CONTROL</h1>
        </div>
        <div className="ff-headeractions">
          <div className="mode-toggle">
            <button className={`mode-btn ${!isEditMode ? "active" : ""}`} onClick={() => handleToggleEdit("view")}>VIEW</button>
            <button className={`mode-btn ${isEditMode ? "active" : ""}`} onClick={() => handleToggleEdit("edit")}>EDIT</button>
          </div>
        </div>
      </header>

      {/* Tournament Context Selector */}
      {state.tournaments.length > 0 && tab !== "global" && tab !== "register" && tab !== "admin" && (
        <div style={{display:"flex", alignItems:"center", gap:"8px", marginBottom:"16px", background:"var(--panel-alt)", padding:"8px 12px", borderRadius:"6px", border:"1px solid var(--border)"}}>
          <span className="hint">Selected Tournament context:</span>
          <select className="dropdown-simple" style={{width:"250px"}} value={selectedTournamentId} onChange={(e) => setSelectedTournamentId(e.target.value)}>
            {state.tournaments.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}
          </select>
        </div>
      )}

      <nav className="ff-tabs">
        <button className={`tabbtn ${tab === "global" ? "active" : ""}`} onClick={() => setTab("global")}>Global Leaderboard</button>
        <button className={`tabbtn ${tab === "register" ? "active" : ""}`} onClick={() => setTab("register")}>Registration</button>
        <button className={`tabbtn ${tab === "setup" ? "active" : ""}`} onClick={() => setTab("setup")}>Setup Groups</button>
        <button className={`tabbtn ${tab === "A" ? "active" : ""}`} onClick={() => setTab("A")}>Group A</button>
        <button className={`tabbtn ${tab === "B" ? "active" : ""}`} onClick={() => setTab("B")}>Group B</button>
        <button className={`tabbtn ${tab === "final" ? "active" : ""}`} onClick={() => setTab("final")}>Finals</button>
        {(isEditMode || state.pendingRegistrations.length > 0) && (
          <button className={`tabbtn ${tab === "admin" ? "active" : ""}`} onClick={() => setTab("admin")} style={{marginLeft: "auto"}}>Admin Panel</button>
        )}
      </nav>

      {/* GLOBAL LEADERBOARD */}
      {tab === "global" && (
        <section className="panel">
          <div className="panel-head">
            <h2>Global Leaderboard</h2>
            <span className="hint">Accumulates points across ALL tournaments. Total Registered Teams: {state.teams.length}</span>
          </div>
          <StandingsTable rows={globalStandings} medalTop3={true} />
        </section>
      )}

      {/* REGISTRATION */}
      {tab === "register" && (
        <RegistrationTab 
          allTeams={state.teams} 
          activeTournaments={state.tournaments.filter(x => x.status === "active")} 
          onRegisterTeam={handleRegisterTeam} 
          onRequestTournament={handleRequestTournament} 
        />
      )}
      
      {/* ADMIN PANEL */}
      {tab === "admin" && (
        <section className="panel">
          <div className="panel-head">
            <h2>Admin Panel</h2>
            {isEditMode && (
              <button className="btn btn-accent btn-sm" onClick={handleCreateTournament}>+ Create New Tournament</button>
            )}
          </div>
          
          <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "24px", marginBottom: "8px"}}>
            <h3 className="h3" style={{color: "var(--accent-b)", margin: 0}}>Manage Global Teams</h3>
            {isEditMode && (
              <button className="btn btn-danger btn-sm" onClick={() => {
                if(confirm("Are you sure you want to delete ALL teams from the database? This will break any existing tournaments!")) {
                  persist({ ...state, teams: [] });
                }
              }}>Clear Entire Database</button>
            )}
          </div>
          <table className="standings" style={{marginBottom: "24px"}}>
            <thead>
              <tr><th>Team Name</th><th>Captain</th><th>Phone</th>{isEditMode && <th>Actions</th>}</tr>
            </thead>
            <tbody>
              {state.teams.map(x => (
                <tr key={x.id}>
                  <td>{x.name}</td><td>{x.captain}</td><td>{x.phone}</td>
                  {isEditMode && <td><button className="btn-x" style={{color:"var(--accent)"}} onClick={() => {
                    if(confirm(`Delete team ${x.name}?`)) {
                      persist({ ...state, teams: state.teams.filter(t => t.id !== x.id) });
                    }
                  }}>Delete</button></td>}
                </tr>
              ))}
              {state.teams.length === 0 && <tr><td colSpan={isEditMode ? 4 : 3} className="hint" style={{textAlign:"center", padding:"20px"}}>No teams registered.</td></tr>}
            </tbody>
          </table>

          <h3 className="h3" style={{color: "var(--accent-b)", marginTop: "24px", marginBottom: "8px"}}>Manage Tournaments</h3>
          <table className="standings" style={{marginBottom: "24px"}}>
            <thead>
              <tr><th>Tournament Name</th><th>Participants</th><th>Status</th>{isEditMode && <th>Actions</th>}</tr>
            </thead>
            <tbody>
              {state.tournaments.map(x => (
                <tr key={x.id}>
                  <td>{x.name}</td><td>{x.participants.length} Teams</td>
                  <td><span className="status-pill status-approved">{x.status}</span></td>
                  {isEditMode && <td><button className="btn-x" style={{color:"var(--accent)"}} onClick={() => handleRemoveTournament(x.id)}>Delete</button></td>}
                </tr>
              ))}
              {state.tournaments.length === 0 && <tr><td colSpan="4" className="hint" style={{textAlign:"center", padding:"20px"}}>No tournaments created.</td></tr>}
            </tbody>
          </table>

          <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "24px", marginBottom: "8px"}}>
            <h3 className="h3" style={{color: "var(--gold)", margin: 0}}>Tournament Registrations</h3>
            {isEditMode && (
              <button className="btn btn-danger btn-sm" onClick={() => {
                if(confirm("Delete all registration requests? (This won't remove teams from tournaments if already approved, just clears the log)")) {
                  persist({ ...state, pendingRegistrations: [] });
                }
              }}>Clear All Requests</button>
            )}
          </div>
          <table className="standings">
            <thead>
              <tr>
                <th>Tournament</th><th>Team Name</th><th>Captain</th><th>Payer Name</th><th>Status</th>
                {isEditMode && <th>Action</th>}
              </tr>
            </thead>
            <tbody>
              {state.pendingRegistrations.map(req => {
                const tourney = state.tournaments.find(x => x.id === req.tournamentId);
                const team = state.teams.find(x => x.id === req.teamId);
                return (
                  <tr key={req.id}>
                    <td>{tourney ? tourney.name : "Deleted"}</td>
                    <td>{team ? team.name : "Deleted"}</td>
                    <td>{team ? team.captain : "-"}</td>
                    <td>{req.payerName}</td>
                    <td><span className={`status-pill status-${req.status}`}>{req.status}</span></td>
                    {isEditMode && (
                      <td style={{display:"flex", gap:"8px"}}>
                        {req.status === "pending" && (
                          <>
                            <button className="btn btn-success btn-sm" onClick={() => handleApproveReq(req.id)}>Approve</button>
                            <button className="btn btn-danger btn-sm" onClick={() => handleRejectReq(req.id)}>Reject</button>
                          </>
                        )}
                        {req.status !== "pending" && (
                          <button className="btn-x" style={{color: "var(--muted)"}} onClick={() => {
                            if(confirm("Delete this request log?")) {
                              persist({ ...state, pendingRegistrations: state.pendingRegistrations.filter(r => r.id !== req.id) });
                            }
                          }}>Delete Log</button>
                        )}
                      </td>
                    )}
                  </tr>
                );
              })}
              {state.pendingRegistrations.length === 0 && <tr><td colSpan="6" className="hint" style={{textAlign:"center", padding:"20px"}}>No registration requests.</td></tr>}
            </tbody>
          </table>
        </section>
      )}

      {/* TOURNAMENT SPECIFIC TABS */}
      {t && tab === "setup" && (
        <section className="panel">
          <div className="panel-head">
            <h2>Group Assignment: {t.name}</h2>
            <span className="hint">Assign approved participants to Group A or Group B</span>
          </div>
          <div style={{display: "flex", gap: "16px", flexWrap: "wrap"}}>
            {/* GROUP A SETUP */}
            <div style={{flex: 1, minWidth: "300px"}}>
              <h3 style={{color: "var(--accent)", fontFamily: "'Teko', sans-serif", fontSize: "20px"}}>GROUP A</h3>
              {isEditMode && (
                <div style={{display: "flex", gap: "8px", marginBottom: "12px"}}>
                  <SearchableDropdown 
                    options={state.teams.filter(team => t.participants.includes(team.id) && !t.groupA.includes(team.id))} 
                    value="" onChange={(id) => toggleGroup(id, "A")} placeholder="Select a participant to add..." 
                  />
                </div>
              )}
              <div className="roster-grid">
                {t.groupA.map(id => {
                  const team = state.teams.find(x => x.id === id);
                  if(!team) return null;
                  return (
                    <div className="roster-row" key={id}>
                      <span className="roster-name">{team.name}</span>
                      {isEditMode && <button className="btn-x" onClick={() => toggleGroup(id, "A")}>✕</button>}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* GROUP B SETUP */}
            <div style={{flex: 1, minWidth: "300px"}}>
              <h3 style={{color: "var(--accent-b)", fontFamily: "'Teko', sans-serif", fontSize: "20px"}}>GROUP B</h3>
              {isEditMode && (
                <div style={{display: "flex", gap: "8px", marginBottom: "12px"}}>
                  <SearchableDropdown 
                    options={state.teams.filter(team => t.participants.includes(team.id) && !t.groupB.includes(team.id))} 
                    value="" onChange={(id) => toggleGroup(id, "B")} placeholder="Select a participant to add..." 
                  />
                </div>
              )}
              <div className="roster-grid">
                {t.groupB.map(id => {
                  const team = state.teams.find(x => x.id === id);
                  if(!team) return null;
                  return (
                    <div className="roster-row" key={id}>
                      <span className="roster-name">{team.name}</span>
                      {isEditMode && <button className="btn-x" onClick={() => toggleGroup(id, "B")}>✕</button>}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </section>
      )}

      {t && (tab === "A" || tab === "B") && (
        <section className="panel">
          <div className="panel-head">
            <h2>Group {tab} Leaderboard: {t.name}</h2>
            {isEditMode && (
              <button className="btn btn-accent btn-sm" onClick={() => setFormOpen(tab)}>+ Log Match</button>
            )}
          </div>
          
          {formOpen === tab && isEditMode && (
            <MatchForm
              allTeams={state.teams}
              availableTeamIds={tab === "A" ? t.groupA : t.groupB}
              label={`Group ${tab} Match`}
              onCancel={() => setFormOpen(null)}
              onSubmit={(results, map) => addMatch(tab, results, map)}
            />
          )}

          <StandingsTable rows={tab === "A" ? groupAStandings : groupBStandings} highlightTop={6} />
          <p className="hint" style={{marginTop: "8px"}}>Points shown are from {t.name} Group {tab} matches only.</p>

          <div className="matchlog">
            {t.groupMatches.filter(m => m.group === tab).map(m => (
              <div className="matchlog-row" key={m.id}>
                <span>{m.label} <span className="mapchip">{m.map}</span></span>
                {isEditMode && <button className="btn-x" onClick={() => removeGroupMatch(m.id)}>Delete</button>}
              </div>
            ))}
          </div>
        </section>
      )}

      {t && tab === "final" && (
        <section className="panel">
          <div className="panel-head">
            <h2>Finals Leaderboard: {t.name}</h2>
            {isEditMode && <button className="btn btn-accent btn-sm" onClick={() => setFormOpen("final")}>+ Log Finals Match</button>}
          </div>

          {formOpen === "final" && isEditMode && (
            <MatchForm
              allTeams={state.teams}
              availableTeamIds={t.participants} 
              label={`Finals Match`}
              onCancel={() => setFormOpen(null)}
              onSubmit={addFinalMatch}
            />
          )}

          {finalsTeamIds.length > 0 ? (
            <StandingsTable rows={finalStandings} medalTop3={true} />
          ) : (
            <p className="hint">Log a finals match to see the standings here.</p>
          )}

          <div className="matchlog" style={{marginTop: "16px"}}>
            {t.finalMatches.map(m => (
              <div className="matchlog-row" key={m.id}>
                <span>{m.label} <span className="mapchip">{m.map}</span></span>
                {isEditMode && <button className="btn-x" onClick={() => removeFinalMatch(m.id)}>Delete</button>}
              </div>
            ))}
          </div>
        </section>
      )}
      
      {/* Handle empty tournament case */}
      {!t && (tab === "setup" || tab === "A" || tab === "B" || tab === "final") && (
        <div className="panel"><p className="hint" style={{textAlign:"center"}}>Please create or select an active tournament first.</p></div>
      )}
    </div>
  );
}

// Entry Point
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const root = document.getElementById("root");
      if (root.innerHTML.trim() === "") {
        root.innerHTML = `
          <div class="ff-root">
            <div class="panel" style="max-width: 600px; margin: 50px auto; text-align: center;">
              <h2 style="color: var(--accent);">Failed to load modules</h2>
              <p>Your browser is blocking the local scripts due to CORS security policies.</p>
              <p><strong>Solution:</strong> Please serve this folder using a local web server.</p>
            </div>
          </div>
        `;
      }
    }, 1500);
  });
</script>
</body>
</html>
